<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Streamer AI - Neon Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(236, 72, 153, 0.1); }
        .active-track { border-left: 4px solid #db2777; background: rgba(219, 39, 119, 0.1); }
        .neon-border { box-shadow: 0 0 15px rgba(219, 39, 119, 0.3); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 10px; }
        .progress-bar { transition: width 0.1s linear; }
        .debug-log { font-family: 'Fira Code', monospace; font-size: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 bg-[radial-gradient(ellipse_at_bottom_left,_var(--tw-gradient-stops))] from-purple-950 via-slate-950 to-black">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 bg-gradient-to-r from-purple-900 to-pink-700 p-6 rounded-3xl shadow-2xl relative overflow-hidden neon-border">
            <div class="relative z-10">
                <h1 class="text-4xl font-black italic tracking-tighter text-white">STREAM RADIO AI</h1>
                <p class="text-pink-100 text-sm font-medium">Neon & Cyber Vibes ✨</p>
            </div>
            <div id="status-indicator" class="relative z-10 px-6 py-2 bg-black/40 border border-pink-400/30 backdrop-blur-md rounded-full text-xs font-bold text-pink-300 animate-pulse">SISTEMA EN LÍNEA</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <section class="lg:col-span-4 space-y-4">
                <div class="glass p-6 rounded-3xl shadow-xl border border-pink-500/10">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><span class="text-pink-500">🕹️</span> Cabina de Control</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-purple-400 mb-1 uppercase tracking-widest">Nombre del Locutor/a</label>
                            <input type="text" id="username" value="Elizabeth" class="w-full bg-black/50 border border-purple-900/50 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-pink-500 outline-none text-sm text-pink-100">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-purple-400 mb-1 uppercase tracking-widest">Videojuego Actual</label>
                            <input type="text" id="game" value="Forza 5" class="w-full bg-black/50 border border-purple-900/50 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-pink-500 outline-none text-sm text-pink-100">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-purple-400 mb-1 uppercase tracking-widest">Voz IA</label>
                                <select id="voice-select" class="w-full bg-black/50 border border-purple-900/50 rounded-xl px-3 py-2.5 text-xs text-pink-100">
                                    <option value="Kore">Kore (Cálida)</option>
                                    <option value="Leda">Leda (Elegante)</option>
                                    <option value="Aoede">Aoede (Activa)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-purple-400 mb-1 uppercase tracking-widest">Estado Ánimo</label>
                                <select id="mood-select" class="w-full bg-black/50 border border-purple-900/50 rounded-xl px-3 py-2.5 text-xs text-pink-100">
                                    <option value="alegre y dinámica">Alegre</option>
                                    <option value="misteriosa y épica">Misteriosa</option>
                                    <option value="irónica y graciosa">Graciosa</option>
                                </select>
                            </div>
                        </div>
                        <div id="debug-console" class="w-full h-32 bg-black/60 rounded-xl p-3 debug-log overflow-y-auto border border-pink-900/30 text-pink-300">
                            > Iniciando entorno neon...
                        </div>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl border border-pink-500/10">
                    <label class="group flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-purple-900 rounded-2xl cursor-pointer hover:border-pink-500 hover:bg-pink-500/5 transition-all">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <span class="text-2xl mb-2 group-hover:scale-125 transition-transform">🎵</span>
                            <p class="text-xs text-purple-400 font-bold uppercase tracking-tighter">Subir MP3</p>
                        </div>
                        <input type="file" id="file-upload" accept="audio/mpeg" multiple class="hidden">
                    </label>
                </div>
            </section>

            <section class="lg:col-span-8 space-y-6">
                <div id="announcer-box" class="hidden glass border-pink-500/40 p-8 rounded-3xl bg-gradient-to-br from-purple-900/20 via-black to-transparent relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-pink-500"></div>
                    <div class="flex items-start gap-6 relative z-10">
                        <div class="w-16 h-16 bg-pink-600 rounded-2xl flex items-center justify-center animate-pulse"><span class="text-3xl">🎙️</span></div>
                        <div class="flex-1">
                            <h3 class="text-pink-400 font-black text-xs uppercase mb-2">Locutora Generando Voz...</h3>
                            <p id="announcement-text" class="text-lg font-medium text-pink-50 italic">Sintonizando...</p>
                        </div>
                    </div>
                </div>

                <div class="glass rounded-3xl overflow-hidden border border-pink-500/10">
                    <div class="p-6 border-b border-purple-950 flex justify-between items-center bg-black/40">
                        <h2 class="font-black text-xl text-white">PLAYLIST <span class="text-pink-500">NOIR</span></h2>
                        <button id="start-btn" class="bg-pink-600 hover:bg-pink-500 px-8 py-3 rounded-2xl text-xs font-black text-white transition-all uppercase">▶ Iniciar Radio</button>
                    </div>
                    <div id="playlist-container" class="max-h-[400px] overflow-y-auto p-4 space-y-2"></div>
                </div>

                <div id="mini-player" class="hidden glass p-6 rounded-3xl border border-pink-500/20 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-purple-950"><div id="progress-line" class="progress-bar h-full bg-pink-500 w-0"></div></div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-purple-900/50 rounded-xl flex items-center justify-center text-2xl text-pink-400">💿</div>
                            <div>
                                <p id="current-track-name" class="text-sm font-black text-white">Música</p>
                                <p class="text-[10px] text-pink-400 font-black uppercase">En Vivo</p>
                            </div>
                        </div>
                        <button id="play-pause-btn" class="w-14 h-14 bg-white text-black rounded-full text-xl hover:scale-110 transition-all">⏸</button>
                    </div>
                </div>
                <audio id="audio-player" class="hidden"></audio>
            </section>
        </div>
    </div>

    <script type="module">
        const MODEL_TEXT = 'gemini-1.5-flash';
        const MODEL_TTS = 'gemini-1.5-flash-8b';

        const fileUpload = document.getElementById('file-upload');
        const playlistContainer = document.getElementById('playlist-container');
        const audioPlayer = document.getElementById('audio-player');
        const startBtn = document.getElementById('start-btn');
        const announcerBox = document.getElementById('announcer-box');
        const announcementText = document.getElementById('announcement-text');
        const statusIndicator = document.getElementById('status-indicator');
        const miniPlayer = document.getElementById('mini-player');
        const currentTrackName = document.getElementById('current-track-name');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressLine = document.getElementById('progress-line');
        const debugConsole = document.getElementById('debug-console');

        let playlist = [];
        let currentIndex = -1;
        let locPlayer = null;

        function logDebug(msg) {
            const div = document.createElement('div');
            div.innerHTML = `> ${msg}`;
            debugConsole.prepend(div);
        }

        fileUpload.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => {
                playlist.push({ name: file.name, url: URL.createObjectURL(file) });
            });
            renderPlaylist();
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = `p-4 rounded-2xl cursor-pointer ${index === currentIndex ? 'active-track bg-pink-500/10' : 'bg-black/40'}`;
                div.innerHTML = `<p class="text-sm text-pink-100">${track.name}</p>`;
                div.onclick = () => playTrack(index);
                playlistContainer.appendChild(div);
            });
        }

        async function playTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            audioPlayer.pause();
            if (locPlayer) locPlayer.pause();
            currentIndex = index;
            renderPlaylist();
            miniPlayer.classList.remove('hidden');
            currentTrackName.innerText = playlist[index].name;
            announcerBox.classList.remove('hidden');

            try {
                const script = await callGeminiProxy(MODEL_TEXT, await generatePrompt(playlist[index].name));
                announcementText.innerText = script;
                const audioBlob = await callGeminiProxyTTS(MODEL_TTS, script);
                await playLocution(audioBlob);
                audioPlayer.src = playlist[index].url;
                audioPlayer.play();
                statusIndicator.innerText = "📻 ON AIR";
            } catch (e) {
                logDebug("Error: " + e.message);
                audioPlayer.src = playlist[index].url;
                audioPlayer.play();
            }
        }

        async function generatePrompt(track) {
            const user = document.getElementById('username').value;
            const game = document.getElementById('game').value;
            const mood = document.getElementById('mood-select').value;
            return `Actúa como locutora gamer estilo ${mood}. Usuario: ${user}. Juego: ${game}. Presenta: "${track}". Sé breve (15 palabras).`;
        }

        async function callGeminiProxy(model, text) {
            const res = await fetch('/api/gemini', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model, contents: [{ parts: [{ text }] }] })
            });
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function callGeminiProxyTTS(model, text) {
            const res = await fetch('/api/gemini', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model,
                    contents: [{ parts: [{ text }] }],
                    generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: document.getElementById('voice-select').value } } } }
                })
            });
            const data = await res.json();
            const b64 = data.candidates[0].content.parts[0].inlineData.data;
            return pcmToWav(b64, 24000);
        }

        function pcmToWav(base64, sampleRate) {
            const bin = atob(base64);
            const bytes = new Int16Array(bin.length / 2);
            for (let i = 0; i < bin.length; i += 2) bytes[i / 2] = (bin.charCodeAt(i + 1) << 8) | bin.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length * 2);
            const view = new DataView(buffer);
            const s = (o, str) => { for (let i = 0; i < str.length; i++) view.setUint8(o + i, str.charCodeAt(i)); };
            s(0, 'RIFF'); view.setUint32(4, 36 + bytes.length * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true); s(36, 'data');
            view.setUint32(40, bytes.length * 2, true);
            for (let i = 0; i < bytes.length; i++) view.setInt16(44 + i * 2, bytes[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function playLocution(blob) {
            return new Promise(res => {
                locPlayer = new Audio(URL.createObjectURL(blob));
                locPlayer.onended = res;
                locPlayer.play();
            });
        }

        audioPlayer.ontimeupdate = () => {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressLine.style.width = `${percent}%`;
        };

        playPauseBtn.onclick = () => {
            if (audioPlayer.paused) { audioPlayer.play(); playPauseBtn.innerText = "⏸"; }
            else { audioPlayer.pause(); playPauseBtn.innerText = "▶"; }
        };

        startBtn.onclick = () => playTrack(0);
    </script>
</body>
</html>
